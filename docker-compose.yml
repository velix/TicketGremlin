services:
  ticketgremlin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketgremlin
    restart: unless-stopped
    ports:
      # HOST:CONTAINER - reachable on the LAN at http://<host-ip>:7143
      - "7143:8080"
    environment:
      - PRINTER_CONNECTION=network
      - PRINTER_HOST=192.168.2.118
      - PRINTER_PORT=9100
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:8080/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5s
