services:
  ticketgremlin:
    build: .
    ports:
      - "8080:8080"
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
    volumes:
      - ./images:/app/images
    environment:
      - PRINTER_CONNECTION=usb
      - PRINTER_HOST=
      - PRINTER_PORT=9100
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5s
